<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qhess</title>
    <link rel="stylesheet" href="style.css">
    <!-- <script src="socket.io/socket.io.js"></script> -->
    <script type="module" src="src/client/main.js"></script>
</head>

<body>
    <header>
        <div class="header-group">
            <button class="icon-button" id="infoButton" title="Information">ℹ️</button>
            <button class="icon-button" id="helpButton" title="Game Help">❔</button>
        </div>
        <h1 class="title">Qhess</h1>
        <div class="header-group">
            <button class="icon-button" id="optionsButton" title="Options">⚙️</button>
        </div>
    </header>

    <!-- MODALS: shown and hidden by src/client/modals.js -->
    <!-- information modal - credits, rules? -->
    <div id="infoWrapper" class="modalWrapper">
        <div id="infoDiv" class="modalData">
            <h2>What is Qhess?</h2>
            Simply: it is your daily insanity chess!<br>
            <h3>Credit:</h3>
            <ul>
                <li>Thomas Bremner</li>
                <li>Nemo Thorx</li>
                <li>Eddie Woodford</li>
            </ul>
            <a href="http://wiki.thorx.net/wiki/QuantumChess">Qhess on ThorxWiki</a>
        </div>
    </div>
    <!-- help modal - game UI help -->
    <div id="helpWrapper" class="modalWrapper">
        <div id="helpDiv" class="modalData">
            <h2>Help!</h2>
            Explain the game UI here<br>
            <br>
            <em>Whaddya mean it's not "intuitive"?</em>
        </div>
    </div>
    <!-- options modal -->
    <div id="optionsWrapper" class="modalWrapper">
        <div id="optionsDiv" class="modalData">
            <h2>Options</h2>
            <button id="toggleFlippedBoard">Toggle player view</button>
        </div>
    </div>
    <!-- END MODALS -->

    <main class="container">
        <!-- BOARD: the rows and squares are made by buildBoard() in src/client/render.js -->
        <div class="board-area" id="gameArea">
            <div id="board" class="board"></div>
        </div>

        <!-- CONTROL PANEL -->
        <aside class="game-control">
            <!-- whose turn it is, what to do next, and the buttons for it -->
            <div class="status">
                <h3 class="prompt" id="prompt">Prompt Text</h3>
                <div class="button-row">
                    <button class="sidebutton" id="sideButton1"></button>
                    <button class="sidebutton" id="sideButton2"></button>
                </div>
            </div>

            <!-- notation for the move being made -->
            <div class="staged">
                <h3>Staged Move:</h3>
                <input id="thismove">
            </div>

            <!-- tabbed panels: a hidden radio and its label per tab; the checked one shows its panel -->
            <div class="panels">
                <input class="hidden" id="tab2" type="radio" name="tabs" checked>
                <label class="tabTitle" for="tab2">History</label>

                <input class="hidden" id="tab3" type="radio" name="tabs">
                <label class="tabTitle" for="tab3">Find Pieces</label>

                <!-- history tab - move history and controls -->
                <div class="tab-panel" id="gameMetaTab">
                    <h4>Move History:</h4>
                    <div class="button-row">
                        <button class="stepHistoryButton" id="back2">&lt;&lt;</button>
                        <button class="stepHistoryButton" id="back1">&lt;</button>
                        <button class="stepHistoryButton" id="forward1">&gt;</button>
                        <button class="stepHistoryButton" id="forward2">&gt;&gt;</button>
                    </div>
                    <div class="movehistory" id="movehistory" contenteditable></div>
                    <div class="button-row">
                        <button class="historyButton" id="reset">Reset Game</button>
                        <button class="historyButton" id="restorehistory">Restore History</button>
                    </div>
                    <div class="button-row">
                        <button class="historyButton" id="copyallhistory">Copy All</button>
                        <button class="historyButton" id="copylastmove">Copy Last Move</button>
                    </div>
                    <div class="button-row">
                        <button class="historyButton" id="pasteallrestore">Paste All &amp; Reset</button>
                        <button class="historyButton" id="pastelinerestore">Paste Move</button>
                    </div>
                </div>

                <!-- find pieces tab - for game assistance -->
                <div class="tab-panel" id="gameFindpiecesTab">
                    <div class="find-grid">
                        <button class="findpiecebutton" id="findK"><div class="findpiece" id="findKpiece"></div></button>
                        <button class="findpiecebutton" id="findQ"><div class="findpiece" id="findQpiece"></div></button>
                        <button class="findpiecebutton" id="findR"><div class="findpiece" id="findRpiece"></div></button>
                        <button class="findpiecebutton" id="findB"><div class="findpiece" id="findBpiece"></div></button>
                        <button class="findpiecebutton" id="findN"><div class="findpiece" id="findNpiece"></div></button>
                        <button class="findpiecebutton" id="findP"><div class="findpiece" id="findPpiece"></div></button>
                    </div>
                    <div class="captured-pieces">
                        <div class="column" id="whitecaptured"><strong>White Captured</strong></div>
                        <div class="column" id="blackcaptured"><strong>Black Captured</strong></div>
                    </div>
                </div>
            </div>

            <!-- messages from debugPrint() in src/client/render.js -->
            <div class="debug" id="debug"></div>
        </aside>
    </main>
</body>

</html>
