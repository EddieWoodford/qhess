<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Qhess game generator</title>
<style>
	body { font-family: sans-serif; margin: 16px; }
	textarea { width: 100%; height: 260px; font-family: monospace; }
	iframe { width: 1000px; height: 720px; border: 1px solid #888; }
	label { margin-right: 12px; }
</style>
</head>
<body>
<h1>Random game generator</h1>
<p>Plays random legal games by driving the real game page in the frame below, the same way a player clicking would.
Copy the history into a file in <code>example_games/</code> to keep it as a test case.</p>
<label>Seed <input id="seed" type="number" value="1"></label>
<label>Max plies <input id="maxPlies" type="number" value="80"></label>
<label>Pawn bias <input id="pawnBias" type="number" value="1" step="0.5"></label>
<button id="go">Play</button>
<pre id="summary"></pre>
<textarea id="out"></textarea>
<iframe id="game"></iframe>

<script>
"use strict";

// Small seeded random number generator, so a seed always gives the same game
function mulberry32(a) {
	return function () {
		a |= 0; a = a + 0x6D2B79F5 | 0;
		let t = Math.imul(a ^ a >>> 15, 1 | a);
		t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
		return ((t ^ t >>> 14) >>> 0) / 4294967296;
	};
}

// Load a fresh copy of the game into the frame. Returns the frame's window and the game module's exports
// (imported from inside the frame, so it is the same instance the page is running).
const GAME_MODULE_URL = new URL("../src/client/controller.js", location.href).href;
function loadFrame() {
	return new Promise(resolve => {
		const frame = document.getElementById("game");
		frame.onload = async () => {
			const win = frame.contentWindow;
			const game = await win.eval("import('" + GAME_MODULE_URL + "')");
			resolve({ win, game });
		};
		frame.src = "../index.html?t=" + Date.now();
	});
}

function historyFeatures(history) {
	const lines = history.split(/\r?\n/);
	const count = re => lines.filter(l => re.test(l)).length;
	return {
		plies: lines.length - 1,
		captures: count(/x/),
		enPassant: count(/e\.p\./),
		promotions: count(/=/),
		potentialChecks: count(/</),
		notAKing: count(/\[/),
		autoChecks: count(/\+(?![^<]*>)/), // a '+' outside the <...> potential-check part
	};
}

// pawnBias > 1 makes pawn-like moves more likely (useful for getting promotions)
async function playGame(seed, maxPlies, pawnBias = 1) {
	const rng = mulberry32(seed);
	const pick = arr => arr[Math.floor(rng() * arr.length)];
	const { win, game: g } = await loadFrame();
	const E = name => g[name]; // read the game's exported page variables (STATE, SQUARES)
	const S = () => g.game; // the current game state object (replaced on every reset)
	const sideButtonVisible = n => win.getComputedStyle(win.document.getElementById("sideButton" + n)).visibility === "visible";

	// When a move is ambiguous (en passant / promotion), the game asks with confirm(). Answer randomly.
	win.confirm = () => rng() < 0.5;

	// Move 0: black passes (no potential check is possible yet)
	g.sideButton2Action();

	let endReason = "reached max plies";
	let plies = 0;
	while (plies < maxPlies) {
		const savedHistory = S().history;
		let declare = S().potCheck && rng() < 0.5;

		// Put the turn back to how it started (optionally re-declaring 'Not a King')
		const resetTurn = () => {
			g.restoreGameHistory(savedHistory);
			if (declare) { g.sideButton1Action(); }
		};

		// List every candidate move for the side to play. Weight captures, pawn pushes, en passant
		// and promotion more heavily so the rarer rules come up in the example games.
		const color = S().turnColor;
		const pieces = S().pieces[color];
		const board = S().board;
		const epCoords = S().epCoords;
		const forward = color === "w" ? -1 : 1;
		const lastRank = color === "w" ? 0 : 7;
		const cands = [];
		for (const p of pieces) {
			if (p.captured > -1) { continue; }
			const canBePawn = p.waves().includes("P");
			for (const to of g.getPotentialMoves(S(), [p.r, p.c])) {
				let weight = board[to[0]][to[1]] !== null ? 4 : 1;
				if (canBePawn && to[1] === p.c && to[0] - p.r === forward) { weight *= 2 * pawnBias; }
				if (canBePawn && to[1] === p.c && to[0] - p.r === 2 * forward) { weight *= 2 * pawnBias; }
				if (canBePawn && to[0] === lastRank && to[0] - p.r === forward) { weight *= 30 * pawnBias; }
				if (canBePawn && epCoords.length === 2 && to[0] === epCoords[0] && to[1] === epCoords[1]) { weight *= 100; }
				cands.push({ from: [p.r, p.c], to, key: Math.pow(rng(), 1 / weight) });
			}
		}
		cands.sort((a, b) => b.key - a.key);

		// Try to play one candidate. Returns true if the move was submitted.
		const attempt = (cand, withPC) => {
			try {
				g.showPartialMove(cand.from);
				g.showCompleteMove(cand.to);
				if (E("STATE") !== "showCompleteMove") { return false; }

				if (withPC) {
					if (!sideButtonVisible(1)) { return false; }
					g.sideButton1Action(); // Add PC
					const kings = [];
					const b = E("SQUARES"); // highlight flags live on the page view
					for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
						if (b[r][c].highlightPotKing === 1) { kings.push([r, c]); }
					}
					if (kings.length === 0) { return false; }
					g.selectPCKing(pick(kings));
					let extra = 0;
					while (E("STATE") === "selectPCAttackers" && extra < 3) {
						const attackers = [];
						const b2 = E("SQUARES");
						for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
							if (b2[r][c].highlightPotAttacker === 1) { attackers.push([r, c]); }
						}
						if (sideButtonVisible(2) && (attackers.length === 0 || rng() < 0.6)) { break; }
						if (attackers.length === 0) { return false; }
						g.selectPCAttackers(pick(attackers));
						extra++;
					}
					if (E("STATE") !== "selectPCAttackers" || !sideButtonVisible(2)) { return false; }
				}

				g.sideButton2Action(); // Submit
				return E("STATE") === "clear";
			} catch (err) {
				return false;
			}
		};

		const tryAll = () => {
			resetTurn();
			for (const cand of cands) {
				const withPC = rng() < 0.5;
				if (attempt(cand, withPC)) { return true; }
				resetTurn();
				if (withPC && attempt(cand, false)) { return true; }
				resetTurn();
			}
			return false;
		};

		let moved = tryAll();
		if (!moved && declare) {
			declare = false;
			moved = tryAll();
		}
		if (!moved) {
			resetTurn();
			endReason = "no legal move for " + (color === "w" ? "white" : "black") + " (checkmate or stalemate)";
			break;
		}
		plies++;
	}

	const history = S().history;
	return { seed, history, endReason, features: historyFeatures(history) };
}

// Replay a history from text in a fresh frame and check it reproduces itself
async function checkRoundTrip(history) {
	const { game: g } = await loadFrame();
	g.restoreGameHistory(history);
	return g.MOVEHISTORY === history;
}

document.getElementById("go").onclick = async () => {
	const seed = +document.getElementById("seed").value;
	const maxPlies = +document.getElementById("maxPlies").value;
	document.getElementById("summary").textContent = "Playing...";
	const pawnBias = +document.getElementById("pawnBias").value;
	const result = await playGame(seed, maxPlies, pawnBias);
	result.roundTrip = await checkRoundTrip(result.history);
	document.getElementById("summary").textContent = JSON.stringify(
		{ seed: result.seed, endReason: result.endReason, roundTrip: result.roundTrip, ...result.features }, null, 1);
	document.getElementById("out").value = result.history;
};
</script>
</body>
</html>
