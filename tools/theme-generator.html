<!DOCTYPE html>
<html lang="en">
<!--
  Qhess board theme generator. Standalone: open this file in a browser (or /tools/theme-generator.html on the
  local server). Pick or generate the board's colours, then Export: save the file in the qhess folder's themes/
  and reload the game (started with start.bat, which updates themes/index.json); the theme appears in
  Settings > Theme under the name given here. Commit the file and themes/index.json to put it on GitHub Pages.
  The style and Light page are part of the theme: Distinct is a colour per type on boxes, Simple one colour per
  side with no boxes and White in outline; Light page sets the page around the board.

  Colour-blind safe (top bar) adds checks that the colours still work for the three standard kinds of colour
  blindness (colour-vision.js simulates them), steers Generate towards meeting them, and shows the preview as each
  kind sees it.

  The preview below repeats the board rules of style.css (sections 7.1 to 7.4) and uses the same CSS variables,
  so it looks as the game will. If those rules change, change them here too.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qhess Theme Generator</title>
<style>
:root {
    --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --ui-bg: #161618;
    --ui-panel: #1f1f22;
    --ui-raised: #2a2a2e;
    --ui-border: #38383e;
    --ui-text: #e8e8ea;
    --ui-muted: #9a9aa2;
    --ui-accent: #ff9500;
    --ui-warn: #ff7a59;
    --ui-ok: #6fcf7f;
    color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top" "pickers preview";
    background: var(--ui-bg);
    color: var(--ui-text);
    font-family: var(--font-ui);
    font-size: 14px;
}

/* ---------- Top bar ---------- */
.topbar {
    grid-area: top;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 12px 16px;
    background: var(--ui-panel);
    border-bottom: 1px solid var(--ui-border);
}
.topbar h1 { font-size: 17px; font-weight: 600; margin: 0 8px 0 0; }
.topbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--ui-muted); }
.topbar input[type="text"] {
    width: 170px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--ui-border); background: var(--ui-bg); color: var(--ui-text); font: inherit;
}
.spacer { flex: 1; }
/* Simple / Distinct: two radio buttons drawn as one two-part switch */
.segmented { display: inline-flex; border: 1px solid var(--ui-border); border-radius: 6px; overflow: hidden; }
.topbar .segmented label { gap: 0; padding: 6px 12px; cursor: pointer; color: var(--ui-text); background: var(--ui-raised); }
.segmented label + label { border-left: 1px solid var(--ui-border); }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.topbar .segmented label:has(input:checked) { background: var(--ui-accent); color: #111; font-weight: 600; }
.segmented label:has(input:focus-visible) { outline: 2px solid var(--ui-text); outline-offset: -2px; }
.segmented[hidden] { display: none; }
.status { font-size: 12px; color: var(--ui-muted); }
.status.warn { color: var(--ui-warn); }
body.dropping .preview { outline: 3px dashed var(--ui-accent); outline-offset: -8px; }
button {
    font: inherit; padding: 7px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--ui-border); background: var(--ui-raised); color: var(--ui-text);
}
button:hover { border-color: var(--ui-muted); }
button.primary { background: var(--ui-accent); border-color: var(--ui-accent); color: #111; font-weight: 600; }

/* ---------- Colour pickers ---------- */
.pickers {
    grid-area: pickers;
    overflow-y: auto;
    padding: 8px 16px 24px;
    background: var(--ui-panel);
    border-right: 1px solid var(--ui-border);
}
.pickers h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ui-muted); margin: 18px 0 6px;
}
.pickers .hint { color: var(--ui-muted); font-size: 12px; margin: 8px 0 0; line-height: 1.4; }
.picker {
    display: grid;
    grid-template-columns: 22px 34px 78px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
}
.picker input[type="checkbox"] { margin: 0; width: 16px; height: 16px; accent-color: var(--ui-accent); cursor: pointer; }
.picker input[type="color"] {
    width: 34px; height: 26px; padding: 0; border: 1px solid var(--ui-border); border-radius: 5px;
    background: none; cursor: pointer;
}
.picker input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
.picker input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }
.picker .hex {
    width: 78px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--ui-border);
    background: var(--ui-bg); color: var(--ui-text); font-family: var(--font-mono); font-size: 13px;
}
.picker .hex.bad { border-color: var(--ui-warn); }
.picker .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker .ratio { font-family: var(--font-mono); font-size: 12px; color: var(--ui-muted); min-width: 44px; text-align: right; }
.picker .ratio.low { color: var(--ui-warn); }
.picker.locked .name { color: var(--ui-accent); }
/* The colour-blind checks: what is met, and which colours look too alike */
.cvd-report { margin: 10px 0 0; padding: 8px 10px; border: 1px solid var(--ui-border); border-radius: 6px; font-size: 12px; line-height: 1.45; }
.cvd-report[hidden] { display: none; }
.cvd-report .ok { color: var(--ui-ok); }
.cvd-report .warn { color: var(--ui-warn); }
.cvd-report ul { margin: 4px 0 0; padding-left: 18px; }
/* A colour the export won't use in the style chosen (Simple: boxes and type colours; Distinct: side colours) */
.pickers .unused { opacity: 0.4; }

/* ---------- Preview ----------
   Everything fits in the preview area without scrolling: "In play" and
   "Pieces" side by side, the 14 square states below them, 7 to a row where the
   area is wide and 5 to a row where it is narrower. The square size is the
   largest that fits both ways. The numbers are measured from the layout:
   7 to a row is 8.33 squares + 115px tall and 13.83 squares + 124px wide,
   5 to a row 9.33 squares + 146px tall and 12.67 squares + 24px wide (each
   with ~10px to spare here); with the fixed parts counted, 5 to a row gives
   the larger squares below an aspect ratio of about 1.37 (1.34 to 1.39 from
   700px to 1000px tall). Change them if the layout changes. */
.preview {
    grid-area: preview;
    container-type: size;
    overflow: hidden;
    padding: 14px 20px;
    background: #181818;              /* the game's page, dark mode */
    color: #eee;
    transition: background-color 0.15s;
}
.preview.page-light { background: #ebebee; color: #1d1d1f; }
.preview-grid {
    --per-row: 7;
    --square: max(24px, min((100cqh - 125px) / 8.34, (100cqw - 134px) / 13.83));
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 12px 24px;
}
@container (aspect-ratio < 1.37) {
    .preview-grid {
        --per-row: 5;
        --square: max(24px, min((100cqh - 156px) / 9.34, (100cqw - 34px) / 12.67));
    }
}
.preview section.states { flex-basis: 100%; }
.preview h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
.preview h2 small { font-weight: 400; opacity: 0.65; margin-left: 6px; }

.examples {
    display: grid;
    grid-template-columns: repeat(var(--per-row), auto);
    justify-content: start;
    gap: 8px 12px;
}
.example {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; line-height: 14px;
}
.example span { max-width: calc(2 * var(--square) + 8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.example .board { padding: 3px; border-radius: 5px; }

/* ===== The board, as style.css 7.1 to 7.4 draws it ===== */
.board {
    font-size: calc(var(--square) / 3);
    display: inline-flex;
    flex-direction: column;
    padding: 0.5em;
    border-radius: 8px;
    background-color: #1a1a1a;
}
.preview.page-light .board { background-color: #fafafa; }
.boardrow { display: flex; flex-direction: row; }
.boardsquare {
    flex-shrink: 0;
    color: white;
    width: 3em;
    height: 3em;
    border: var(--board-square-border) solid 1px;
    font-family: var(--font-mono);
    line-height: 1;
    text-align: center;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}
.whitesquare { background-color: var(--board-white-col); }
.blacksquare { background-color: var(--board-black-col); }

.hovered { background-color: color-mix(in srgb, var(--piece-selectedStart-col) 60%, transparent); }
.selectable { box-shadow: 0 0 0 3px var(--piece-selectedStart-col) inset; }
.selectedStart { box-shadow: 0 0 0 6px var(--piece-selectedStart-col) inset; }
.selectedEnd { box-shadow: 0 0 0 6px var(--piece-dest-col) inset; }
.potKing { background-color: color-mix(in srgb, var(--piece-checkKing-col) 55%, transparent); }
.potAttacker { background-color: color-mix(in srgb, var(--piece-checkAttacker-col) 55%, transparent); }
.checkKing { box-shadow: 0 0 0 6px var(--piece-checkKing-col) inset; }
.checkAttacker { box-shadow: 0 0 0 6px var(--piece-checkAttacker-col) inset; }

/* Move markers (style.css 7.3): a thin line across the square the way the piece moves, an arc round the knight for a knight's hop;
   captures in their colour */
:root {
    --marker-line-up: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M50 0 L50 100' stroke='black' stroke-width='5' stroke-linecap='square'/></svg>");
    --marker-line-up-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M50 0 L50 100' stroke='black' stroke-width='9' stroke-linecap='square'/></svg>");
    --marker-line-across: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M0 50 L100 50' stroke='black' stroke-width='5' stroke-linecap='square'/></svg>");
    --marker-line-across-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M0 50 L100 50' stroke='black' stroke-width='9' stroke-linecap='square'/></svg>");
    --marker-line-ne: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M0 100 L100 0' stroke='black' stroke-width='5' stroke-linecap='square'/></svg>");
    --marker-line-ne-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M0 100 L100 0' stroke='black' stroke-width='9' stroke-linecap='square'/></svg>");
    --marker-line-nw: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M0 0 L100 100' stroke='black' stroke-width='5' stroke-linecap='square'/></svg>");
    --marker-line-nw-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' shape-rendering='crispEdges'><path d='M0 0 L100 100' stroke='black' stroke-width='9' stroke-linecap='square'/></svg>");
    --marker-arc1: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-50' cy='250' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc1-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-50' cy='250' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
    --marker-arc3: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-150' cy='150' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc3-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-150' cy='150' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
    --marker-arc5: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-150' cy='-50' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc5-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-150' cy='-50' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
    --marker-arc7: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-50' cy='-150' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc7-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='-50' cy='-150' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
    --marker-arc9: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='150' cy='-150' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc9-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='150' cy='-150' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
    --marker-arc11: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='250' cy='-50' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc11-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='250' cy='-50' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
    --marker-arc13: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='250' cy='150' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc13-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='250' cy='150' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
    --marker-arc15: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='150' cy='250' r='223.6' fill='none' stroke='black' stroke-width='5'/></svg>");
    --marker-arc15-edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='150' cy='250' r='223.6' fill='none' stroke='black' stroke-width='9'/></svg>");
}
.destination { position: relative; --marker-col: var(--piece-dest-col); --marker-size: 100%; }
.destination1 { --marker: var(--marker-arc1); --marker-edge: var(--marker-arc1-edge); }
.destination3 { --marker: var(--marker-arc3); --marker-edge: var(--marker-arc3-edge); }
.destination5 { --marker: var(--marker-arc5); --marker-edge: var(--marker-arc5-edge); }
.destination7 { --marker: var(--marker-arc7); --marker-edge: var(--marker-arc7-edge); }
.destination9 { --marker: var(--marker-arc9); --marker-edge: var(--marker-arc9-edge); }
.destination11 { --marker: var(--marker-arc11); --marker-edge: var(--marker-arc11-edge); }
.destination13 { --marker: var(--marker-arc13); --marker-edge: var(--marker-arc13-edge); }
.destination15 { --marker: var(--marker-arc15); --marker-edge: var(--marker-arc15-edge); }
.destination8, .destination16 { --marker: var(--marker-line-up); --marker-edge: var(--marker-line-up-edge); }
.destination4, .destination12 { --marker: var(--marker-line-across); --marker-edge: var(--marker-line-across-edge); }
.destination2, .destination10 { --marker: var(--marker-line-ne); --marker-edge: var(--marker-line-ne-edge); }
.destination6, .destination14 { --marker: var(--marker-line-nw); --marker-edge: var(--marker-line-nw-edge); }
.destinationCapture {
    --marker-col: var(--piece-capture-col);
    box-shadow: 0 0 0 3px var(--piece-capture-col) inset;
}
.destination::before, .destination::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    mask: var(--marker-edge) center / var(--marker-size) var(--marker-size) no-repeat;
    background-color: #000a;
}
.destination::after { mask-image: var(--marker); background-color: var(--marker-col); }

.whitepiece, .blackpiece, .whitepiececollapsed, .blackpiececollapsed {
    display: grid;
    width: 100%;
    height: 100%;
}
.whitepiece, .blackpiece {
    grid-template: repeat(2, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr));
    font-size: var(--uncollapsed-size);
}
.whitepiececollapsed, .blackpiececollapsed { font-size: var(--collapsed-size); }

/* How the pieces are drawn: as a theme sets it (exportCss), boxes or Simple */
.preview {
    --glyph-radius: 0.25em;
    --glyph-margin: 2px;
    --glyph-shadow: 1px 1px 3px #0008;
    --glyph-line-height: 1;
    --uncollapsed-size: 0.9em;
    --collapsed-size: 2.2em;
    --white-K: "\265A"; --white-Q: "\265B"; --white-R: "\265C";
    --white-B: "\265D"; --white-N: "\265E"; --white-P: "\265F";
}
.preview.simple {
    --glyph-radius: 0;
    --glyph-margin: 0;
    --glyph-shadow: none;
    --glyph-line-height: initial;
    --uncollapsed-size: 1em;
    --collapsed-size: 2.7em;
    --white-K: "\2654"; --white-Q: "\2655"; --white-R: "\2656";
    --white-B: "\2657"; --white-N: "\2658"; --white-P: "\2659";
}

.glyph {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    border-radius: var(--glyph-radius);
    margin: var(--glyph-margin);
    box-shadow: var(--glyph-shadow);
    line-height: var(--glyph-line-height);
}
.glyph-w { background-color: var(--glyph-w-bg); }
.glyph-b { background-color: var(--glyph-b-bg); }
.glyph-wK::before { content: var(--white-K); }
.glyph-wQ::before { content: var(--white-Q); }
.glyph-wR::before { content: var(--white-R); }
.glyph-wB::before { content: var(--white-B); }
.glyph-wN::before { content: var(--white-N); }
.glyph-wP::before { content: var(--white-P); }
.glyph-bK::before { content: "\265A"; }
.glyph-bQ::before { content: "\265B"; }
.glyph-bR::before { content: "\265C"; }
.glyph-bB::before { content: "\265D"; }
.glyph-bN::before { content: "\265E"; }
.glyph-bP::before { content: "\265F"; }
/* A light page thickens the white pieces' symbols, as the game does (style.css 7.4) */
.page-light .glyph-w { text-shadow: 0 0 0.6px currentColor, 0 0 0.6px currentColor; }
.glyph-wK { color: var(--piece-wK); }
.glyph-wQ { color: var(--piece-wQ); }
.glyph-wR { color: var(--piece-wR); }
.glyph-wB { color: var(--piece-wB); }
.glyph-wN { color: var(--piece-wN); }
.glyph-wP { color: var(--piece-wP); }
.glyph-bK { color: var(--piece-bK); }
.glyph-bQ { color: var(--piece-bQ); }
.glyph-bR { color: var(--piece-bR); }
.glyph-bB { color: var(--piece-bB); }
.glyph-bN { color: var(--piece-bN); }
.glyph-bP { color: var(--piece-bP); }
.side-colours .glyph-w { color: var(--piece-white-side); }
.side-colours .glyph-b { color: var(--piece-black-side); }
/* A type the move being made has ruled out: faded until it is submitted */
.glyph-lost { opacity: 0.3; filter: grayscale(1); }

/* ---------- Narrow screens: pickers above the preview ---------- */
@media (max-width: 760px) {
    body {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto;
        grid-template-areas: "top" "pickers" "preview";
        height: auto;
    }
    html, body { height: auto; }
    .pickers { border-right: none; border-bottom: 1px solid var(--ui-border); }
    .preview { container-type: normal; overflow: visible; }
    .preview-grid { --square: 46px; }
    .examples { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
}
</style>
</head>
<body>

<div class="topbar">
    <h1>Qhess theme generator</h1>
    <label>Name <input type="text" id="themeName" value="My theme" maxlength="40"></label>
    <button class="primary" id="generate" title="New colours for every colour that isn't locked">Generate random theme</button>
    <button id="export" title="Save the file in the qhess folder's themes/ and reload the game">Export</button>
    <button id="import" title="Load the colours from an exported theme's CSS file (or drop the file on this page)">Import</button>
    <input type="file" id="importFile" accept=".css,text/css" hidden>
    <span id="importStatus" class="status" role="status"></span>
    <span class="spacer"></span>
    <div class="segmented" role="radiogroup" aria-label="Style">
        <label title="Part of the theme: one colour per side, no boxes, White drawn in outline">
            <input type="radio" name="style" id="simple" value="simple"> Simple</label>
        <label title="Part of the theme: each type of piece in its own colour, on a box per side">
            <input type="radio" name="style" id="distinct" value="distinct" checked> Distinct</label>
    </div>
    <label title="Part of the theme: the page around the board light, not dark">
        <input type="checkbox" id="pageLight"> Light page</label>
    <label title="Also check the colours for the three standard kinds of colour blindness (protanopia, deuteranopia, tritanopia), and generate themes that meet those checks">
        <input type="checkbox" id="cvd"> Colour-blind safe</label>
    <div class="segmented" id="cvdView" role="radiogroup" aria-label="Show the preview as seen with" hidden></div>
    <button id="reset" title="Back to the Dark Distinct theme's colours">Reset to Dark Distinct</button>
</div>

<div class="pickers" id="pickers">
    <p class="hint">Tick a lock to keep that colour when generating. The number beside a colour is its contrast
        (piece against its box, highlight against the squares and boxes): orange means hard to see.</p>
    <div class="cvd-report" id="cvdReport" role="status" hidden></div>
</div>

<div class="preview" id="preview">
    <div class="preview-grid">
        <section title="White to move, a rook chosen and its moves shown, Black's king in check">
            <h2>In play</h2>
            <div id="playBoard"></div>
        </section>
        <section title="Each type, once known, on both squares; then pieces that could still be several types (the second has three faded: types a move not yet submitted has ruled out)">
            <h2>Pieces</h2>
            <div id="pieceBoard"></div>
        </section>
        <section class="states">
            <h2>Square states <small>on a light and a dark square</small></h2>
            <div class="examples" id="stateExamples"></div>
        </section>
    </div>
</div>

<script src="colour-vision.js"></script>
<script>
"use strict";

// ---------- The colours: one picker each, in this order. var is the CSS variable the game reads. ----------
const COLOURS = [
    { group: "Squares" },
    { key: "light", var: "--board-white-col", name: "Light square", def: "#aa9988" },
    { key: "dark", var: "--board-black-col", name: "Dark square", def: "#665544" },
    { key: "border", var: "--board-square-border", name: "Square border", def: "#000000" },
    { group: "Boxes" },
    { key: "wbox", var: "--glyph-w-bg", name: "White's box", def: "#4f3a26" },
    { key: "bbox", var: "--glyph-b-bg", name: "Black's box", def: "#121a2a" },
    { group: "White pieces" },
    { key: "wK", var: "--piece-wK", name: "King", def: "#ffd700" },
    { key: "wQ", var: "--piece-wQ", name: "Queen", def: "#ff69b4" },
    { key: "wR", var: "--piece-wR", name: "Rook", def: "#1e90ff" },
    { key: "wB", var: "--piece-wB", name: "Bishop", def: "#ff4500" },
    { key: "wN", var: "--piece-wN", name: "Knight", def: "#ffa500" },
    { key: "wP", var: "--piece-wP", name: "Pawn", def: "#32cd32" },
    { group: "Black pieces" },
    { key: "bK", var: "--piece-bK", name: "King", def: "#f0e68c" },
    { key: "bQ", var: "--piece-bQ", name: "Queen", def: "#ba55d3" },
    { key: "bR", var: "--piece-bR", name: "Rook", def: "#87cefa" },
    { key: "bB", var: "--piece-bB", name: "Bishop", def: "#ff6347" },
    { key: "bN", var: "--piece-bN", name: "Knight", def: "#ffa07a" },
    { key: "bP", var: "--piece-bP", name: "Pawn", def: "#90ee90" },
    { group: "One colour per side", hint: "Exported in the Simple style." },
    { key: "wSide", var: "--piece-white-side", name: "White", def: "#ffffff" },
    { key: "bSide", var: "--piece-black-side", name: "Black", def: "#e8743b" },
    { group: "Highlights" },
    { key: "select", var: "--piece-selectedStart-col", name: "Side to move, chosen", def: "#3fd6e8" },
    { key: "dest", var: "--piece-dest-col", name: "Moves", def: "#4f8f5a" },
    { key: "capture", var: "--piece-capture-col", name: "Captures", def: "#da0b9c" },
    { key: "checkKing", var: "--piece-checkKing-col", name: "King in check", def: "#7a1f1f" },
    { key: "checkAttacker", var: "--piece-checkAttacker-col", name: "Checking piece", def: "#5a8fb5" },
].filter(Boolean);
// Each colour, with the name of the group it is listed under
const ENTRIES = COLOURS.reduce((list, c) => {
    if (c.group) { list.group = c.group; } else { list.push({ ...c, group: list.group }); }
    return list;
}, []);
const TYPES = ["K", "Q", "R", "B", "N", "P"];
const HIGHLIGHTS = ["select", "dest", "capture", "checkKing", "checkAttacker"];
const STORE = "qhess.themeGenerator";

const state = { colours: {}, locked: {} };

// ---------- Colour maths ----------
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);

function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
function rgbToHex(rgb) {
    return "#" + rgb.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join("");
}
// h in degrees, s and l 0..1
function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s = clamp(s, 0, 1); l = clamp(l, 0, 1);
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return rgbToHex([f(0), f(8), f(4)].map(v => v * 255));
}
function toHsl(hex) {
    const [r, g, b] = hexToRgb(hex).map(v => v / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    if (!d) { return { h: 0, s: 0, l }; }
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = max == r ? ((g - b) / d) % 6 : max == g ? (b - r) / d + 2 : (r - g) / d + 4;
    return { h: h * 60, s, l };
}
// (remembered: Generate asks about the same colours many times over)
const luminances = new Map();
function luminance(hex) {
    if (!luminances.has(hex)) {
        const c = hexToRgb(hex).map(v => v / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
        if (luminances.size > 50000) { luminances.clear(); }
        luminances.set(hex, 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]);
    }
    return luminances.get(hex);
}
function contrast(a, b) {
    const x = luminance(a), y = luminance(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
// The lightness, moving from `from` towards lighter (dir 1) or darker (dir -1), at which colour (h, s) first has
// `target` contrast with bg; or the end of the range if it never does.
function solveLightness(h, s, bg, target, dir, from) {
    let l = from;
    while (l >= 0 && l <= 1) {
        if (contrast(hsl(h, s, l), bg) >= target) { return hsl(h, s, l); }
        l += dir * 0.01;
    }
    return hsl(h, s, dir > 0 ? 1 : 0);
}
// Of a range of lightnesses for (h, s), the one whose worst contrast against all of `against` is best
function bestAgainst(h, s, against, lo, hi) {
    let best = null, bestScore = -1;
    for (let l = lo; l <= hi; l += 0.02) {
        const c = hsl(h, s, l);
        const score = Math.min(...against.map(bg => contrast(c, bg)));
        if (score > bestScore) { best = c; bestScore = score; }
    }
    return best;
}

// Colour-blind safe: the same, with each colour as it looks with normal vision and with each kind of colour blindness
const KIND_IDS = ColourVision.KINDS.map(k => k.id);
const VISIONS = [null, ...KIND_IDS];
const seen = (hex, vision) => vision ? ColourVision.simulate(hex, vision) : hex;
function worstSeen(colour, against) {
    let least = Infinity;
    for (const v of VISIONS) {
        for (const bg of against) { least = Math.min(least, contrast(seen(colour, v), seen(bg, v))); }
    }
    return least;
}
// How different a colour looks from the most alike of `others`, with whichever kind of colour blindness makes them
// most alike
function apartness(colour, others) {
    let least = Infinity;
    for (const v of KIND_IDS) {
        for (const o of others) { least = Math.min(least, ColourVision.deltaE(seen(colour, v), seen(o, v))); }
    }
    return least;
}
// Of a range of lightnesses for (h, s), among those with at least `enough` contrast against all of `against` (as
// every kind of vision sees them), the one that looks most different from all of `others`; if none has enough
// contrast, the one with the most
function apartFrom(h, s, against, lo, hi, others, enough) {
    let best = null, bestApart = -1, fallback = null, fallbackScore = -1;
    for (let l = lo; l <= hi + 1e-9; l += 0.03) {
        const c = hsl(h, s, l);
        const contrastScore = worstSeen(c, against);
        if (contrastScore > fallbackScore) { fallback = c; fallbackScore = contrastScore; }
        if (contrastScore < enough) { continue; }
        const apart = apartness(c, others);
        if (apart > bestApart) { best = c; bestApart = apart; }
    }
    return best ?? fallback;
}

// ---------- What "good contrast" means, for the numbers beside the pickers and for scoring a random theme ----------
const TARGET = { piece: 3.5, side: 4.5, boxes: 1.4, squares: 1.3, highlight: 1.5, sidesApart: 1.6 };
// Colour-blind safe only: how different (colour-vision.js deltaE: 2 just noticeable, 10 clearly different) colours
// that mean different things must still look. The types also differ in shape, so theirs is lower.
const APART = { types: 5, highlights: 8 };
const { KINDS, simulate, deltaE } = ColourVision;

// The style, which is part of the theme (see exportCss): Simple (one colour per side, no boxes, White in outline)
// or Distinct (a colour per type, on boxes)
function mode() {
    const simple = document.getElementById("simple").checked;
    return { simple, byType: !simple };
}

// The colour groups a style doesn't export: Simple has no boxes and no colours per type, Distinct no side colours
function unusedGroups(simple) {
    return new Set(simple ? ["Boxes", "White pieces", "Black pieces"] : ["One colour per side"]);
}

// What a piece of this side ("w" or "b") is drawn on: its box, or in Simple mode (no boxes) both squares
function grounds(c, side, simple) {
    return simple ? [c.light, c.dark] : [c[side + "box"]];
}
const worst = (colour, against) => Math.min(...against.map(bg => contrast(colour, bg)));

// Colour-blind safe: the switch in the top bar
function cvdOn() { return document.getElementById("cvd").checked; }

// The colours as someone with this kind of colour blindness (a colour-vision.js KINDS id) sees them; null: as they are
function seenWith(c, kind) {
    if (!kind) { return c; }
    const seen = {};
    for (const key in c) { seen[key] = simulate(c[key], kind); }
    return seen;
}

// The contrast checks, with normal vision and (when colour-blind safe) with each kind of colour blindness:
// { key: the colour the number shows beside (null: none), value: its contrast, target, vision: KINDS id or null }
function checks(c) {
    return (cvdOn() ? VISIONS : [null]).flatMap(vision => contrastChecks(seenWith(c, vision))
        .map(([key, value, target]) => ({ key, value, target, vision })));
}

// Colour-blind safe only: colours that mean different things, which must still look different with each kind of
// colour blindness: each side's six types (Distinct), and the five highlights.
// { a, b: the two colours' keys, value: how different they look, target, vision }
function apartChecks(c) {
    if (!cvdOn()) { return []; }
    const pairs = [];
    const allPairs = (keys, target) => keys.forEach((a, i) => keys.slice(i + 1).forEach(b => pairs.push([a, b, target])));
    if (mode().byType) {
        for (const side of ["w", "b"]) { allPairs(TYPES.map(t => side + t), APART.types); }
    }
    allPairs(HIGHLIGHTS, APART.highlights);
    return KINDS.flatMap(({ id }) => {
        const seen = seenWith(c, id);
        return pairs.map(([a, b, target]) => ({ a, b, value: deltaE(seen[a], seen[b]), target, vision: id }));
    });
}

// The contrast checks of the colours the export will use, as [key, contrast, target] (see checks)
function contrastChecks(c) {
    const { simple, byType } = mode();
    const out = [];
    if (byType) {
        for (const side of ["w", "b"]) {
            for (const t of TYPES) { out.push([side + t, worst(c[side + t], grounds(c, side, simple)), TARGET.piece]); }
        }
    } else {
        out.push(["wSide", worst(c.wSide, grounds(c, "w", simple)), TARGET.side]);
        out.push(["bSide", worst(c.bSide, grounds(c, "b", simple)), TARGET.side]);
        // In Simple mode only the colours (and White's outline) tell the sides apart
        if (simple) { out.push([null, contrast(c.wSide, c.bSide), TARGET.sidesApart]); }
    }
    if (!simple) { out.push(["bbox", contrast(c.wbox, c.bbox), TARGET.boxes]); }
    out.push(["dark", contrast(c.light, c.dark), TARGET.squares]);
    const behind = simple ? [c.light, c.dark] : [c.light, c.dark, c.wbox, c.bbox];
    for (const k of HIGHLIGHTS) { out.push([k, worst(c[k], behind), TARGET.highlight]); }
    return out;
}

// How well a set of colours meets the targets: the worst check's share of its target (1 = all met)
// below: a score already beaten. If normal vision alone scores no better, the colour-blind checks aren't worth doing.
function score(c, below = -1) {
    const of = list => Math.min(...list.map(({ value, target }) => Math.min(1, value / target)));
    const normal = of(contrastChecks(c).map(([, value, target]) => ({ value, target })));
    if (!cvdOn() || normal <= below) { return normal; }
    return Math.min(normal, of([...checks(c).filter(x => x.vision), ...apartChecks(c)]));
}

// ---------- Random themes ----------
// One candidate: every unlocked colour drawn at random within sensible ranges, each fitted to the colours it sits
// on (which may be locked). Locked colours are kept as they are.
function candidate() {
    const c = {};
    const pick = (key, make) => { c[key] = state.locked[key] ? state.colours[key] : make(); };
    const { simple } = mode();
    const cvd = cvdOn();

    // Squares: one hue, the dark square a little darker than the light one. In Simple mode the pieces stand on the
    // squares themselves, so both squares are dark (for light pieces) or both light (for deep ones).
    const boardHue = rnd(0, 360);
    const boardSat = rnd(0.06, 0.4);
    let darkBoard = Math.random() < 0.5;
    if (state.locked.light) { darkBoard = luminance(state.colours.light) < 0.3; }
    else if (state.locked.dark) { darkBoard = luminance(state.colours.dark) < 0.1; }
    pick("light", () => hsl(boardHue, boardSat,
        !simple ? rnd(0.5, 0.82) : darkBoard ? rnd(0.28, 0.4) : rnd(0.86, 0.93)));
    const light = toHsl(c.light);
    pick("dark", () => hsl(light.h + rnd(-12, 12), clamp(light.s + rnd(-0.05, 0.1), 0, 1),
        Math.max(0.05, light.l - (simple ? rnd(0.1, 0.2) : rnd(0.18, 0.32)))));
    const dark = toHsl(c.dark);
    pick("border", () => Math.random() < 0.4 ? "#000000" : hsl(dark.h, dark.s, Math.max(0, dark.l - rnd(0.12, 0.22))));

    // Boxes: dark boxes for bright pieces, or light boxes for deep ones. The two sides differ in hue and lightness.
    let darkBoxes = Math.random() < 0.5;
    if (state.locked.wbox) { darkBoxes = luminance(state.colours.wbox) < 0.3; }
    else if (state.locked.bbox) { darkBoxes = luminance(state.colours.bbox) < 0.3; }
    const wHue = rnd(0, 360), bHue = wHue + rnd(140, 220);
    pick("wbox", () => darkBoxes ? hsl(wHue, rnd(0.2, 0.5), rnd(0.2, 0.3)) : hsl(wHue, rnd(0.2, 0.6), rnd(0.9, 0.97)));
    pick("bbox", () => darkBoxes ? hsl(bHue, rnd(0.25, 0.55), rnd(0.07, 0.14)) : hsl(bHue, rnd(0.12, 0.35), rnd(0.68, 0.8)));

    // What each side's pieces stand on (their box, or in Simple mode both squares), and which way to move a
    // colour's lightness to stand out from it: lighter on dark ground, darker on light
    const ground = side => grounds(c, side, simple);
    const away = side => Math.max(...ground(side).map(luminance)) < 0.3 ? 1 : -1;
    // The first lightness, moving away from the ground, with `target` contrast against all of it (and, if given,
    // `apart` contrast with the colour `other`). Colour-blind safe: as every kind of vision sees it.
    const worstHere = cvd ? worstSeen : worst;
    const fit = (h, s, side, target, other, apart) => {
        const dir = away(side);
        for (let l = dir > 0 ? 0.45 : 0.55; l >= 0 && l <= 1; l += dir * 0.01) {
            const col = hsl(h, s, l);
            if (worstHere(col, ground(side)) >= target && (!other || worstHere(col, [other]) >= apart)) { return col; }
        }
        return hsl(h, s, dir > 0 ? 1 : 0);
    };

    // Pieces: one hue per type, shared by both sides (so a type looks alike on either side), spread round the
    // wheel; each side's lightness fitted to what it stands on. Colour-blind safe: hue alone can't tell the types
    // apart (with two kinds of cone the wheel folds in two), so each type's lightness is the one, of those with
    // enough contrast as every kind of vision sees it, that looks most different from the side's types chosen
    // before it (taken in a random order): that spreads them out in lightness as well as hue.
    const base = rnd(0, 360);
    const typesChosen = { w: [], b: [] };
    for (const side of ["w", "b"]) {
        typesChosen[side] = TYPES.filter(t => state.locked[side + t]).map(t => state.colours[side + t]);
    }
    const order = TYPES.map((t, i) => i);
    if (cvd) { order.sort(() => Math.random() - 0.5); }
    for (const i of order) {
        const hue = base + i * 60 + rnd(-10, 10);
        for (const side of ["w", "b"]) {
            const sat = side == "w" ? rnd(0.65, 0.95) : rnd(0.45, 0.8);
            const h = hue + (side == "b" ? rnd(-12, 12) : 0);
            pick(side + TYPES[i], () => {
                if (!cvd) { return fit(h, sat, side, TARGET.piece + 0.3); }
                const col = apartFrom(h, sat, ground(side), 0, 1, typesChosen[side], TARGET.piece + 0.2);
                typesChosen[side].push(col);
                return col;
            });
        }
    }

    // One colour per side: strong contrast with what it stands on. White's is soft, Black's strong, in hues well
    // apart. In Simple mode both stand on the squares, and the colours (with White's outline) are all that tells the
    // sides apart, so the second is pushed further than the first until they differ too: on a dark board White is
    // the brighter (as ivory on grey), on a light board Black the darker (as ink on cream).
    const wSideHue = rnd(0, 360), bSideHue = wSideHue + rnd(120, 240);
    const wSat = rnd(0.1, 0.5), bSat = rnd(0.55, 0.9);
    const apart = simple ? TARGET.sidesApart + 0.2 : 0;
    if (away("w") > 0) {
        pick("bSide", () => fit(bSideHue, bSat, "b", TARGET.side + 0.3));
        pick("wSide", () => fit(wSideHue, wSat, "w", TARGET.side + 0.3, c.bSide, apart));
    } else {
        pick("wSide", () => fit(wSideHue, wSat, "w", TARGET.side + 0.3));
        pick("bSide", () => fit(bSideHue, bSat, "b", TARGET.side + 0.3, c.wSide, apart));
    }

    // Highlights keep their meaning: check is red, moves green, captures magenta, the checking piece blue to violet;
    // the side to move's colour is outside those four (amber to yellow, or cyan), as far from the squares' hue as it
    // can be. Each lightness is the one that stands out best from the squares and the boxes together (in Simple
    // mode just the squares).
    const against = simple ? [c.light, c.dark] : [c.light, c.dark, c.wbox, c.bbox];
    const hueGap = (a, b) => { const d = Math.abs(((a - b) % 360 + 360) % 360); return Math.min(d, 360 - d); };
    const selectHues = [[35, 65], [172, 192]].flatMap(([lo, hi]) => [rnd(lo, hi), rnd(lo, hi)]);
    const selectHue = selectHues.reduce((a, b) => hueGap(b, light.h) > hueGap(a, light.h) ? b : a);
    // Colour-blind safe: of the lightnesses that stand out well enough as every kind of vision sees them, the one
    // that looks most different from the highlights already chosen (check and moves first: red and green are the
    // pair most often confused)
    const chosen = HIGHLIGHTS.filter(k => state.locked[k]).map(k => state.colours[k]);
    const best = (h, s, lo, hi) => {
        const col = cvd ? apartFrom(h, s, against, lo, hi, chosen, TARGET.highlight + 0.1) : bestAgainst(h, s, against, lo, hi);
        chosen.push(col);
        return col;
    };
    // (Colour-blind safe lets them go lighter and darker: red, for one, looks much darker to many.)
    const wide = cvd ? 0.08 : 0;
    pick("checkKing", () => best(rnd(-12, 12), rnd(0.6, 0.9), 0.2 - wide, 0.7 + wide * 2));
    pick("dest", () => best(rnd(95, 150), rnd(0.45, 0.85), 0.2 - wide, 0.8 + wide));
    pick("checkAttacker", () => best(rnd(200, 270), rnd(0.45, 0.85), 0.2 - wide, 0.8 + wide));
    pick("capture", () => best(rnd(295, 325), rnd(0.65, 0.95), 0.2 - wide, 0.8 + wide));
    // Colour-blind safe: of its hues, the one that ends up looking most different from the other four
    pick("select", () => {
        const sat = rnd(0.6, 0.95);
        if (!cvd) { return best(selectHue, sat, 0.2, 0.85); }
        const enough = TARGET.highlight + 0.1;
        const rank = c => (worstSeen(c, against) >= enough ? 1000 : 0) + apartness(c, chosen);
        return selectHues.map(h => apartFrom(h, sat, against, 0.2 - wide, 0.85 + wide, chosen, enough))
            .reduce((a, b) => rank(b) > rank(a) ? b : a);
    });
    return c;
}

// The best of many candidates (stopping early once one meets every target)
function generate() {
    let best = null, bestScore = -1;
    // Colour-blind safe has more to meet, so it tries more, but for a couple of seconds at most
    const deadline = performance.now() + 2500;
    for (let i = 0, tries = cvdOn() ? 1000 : 400; i < tries && bestScore < 1 && performance.now() < deadline; i++) {
        const c = candidate();
        const s = score(c, bestScore);
        if (s > bestScore) { best = c; bestScore = s; }
    }
    Object.assign(state.colours, best);
    refresh();
}

// ---------- Pickers ----------
const pickers = document.getElementById("pickers");
const rows = {};

for (const item of COLOURS) {
    if (item.group) {
        const h = document.createElement("h2");
        h.textContent = item.group;
        h.dataset.group = item.group;
        pickers.append(h);
        if (item.hint) {
            const p = document.createElement("p");
            p.className = "hint";
            p.style.margin = "-2px 0 6px";
            p.textContent = item.hint;
            p.dataset.group = item.group;
            pickers.append(p);
        }
        continue;
    }
    const row = document.createElement("div");
    row.className = "picker";
    row.dataset.group = ENTRIES.find(e => e.key == item.key).group;
    row.innerHTML = '<input type="checkbox" title="Lock: Generate keeps this colour">'
        + '<input type="color">'
        + '<input type="text" class="hex" maxlength="7" spellcheck="false">'
        + '<span class="name"></span><span class="ratio"></span>';
    const [lock, colour, hex] = row.querySelectorAll("input");
    row.querySelector(".name").textContent = item.name;
    lock.setAttribute("aria-label", "Lock " + item.name);
    colour.setAttribute("aria-label", item.name);
    hex.setAttribute("aria-label", item.name + " hex code");

    lock.addEventListener("change", () => { state.locked[item.key] = lock.checked; refresh(); });
    colour.addEventListener("input", () => { state.colours[item.key] = colour.value; refresh(); });
    hex.addEventListener("input", () => {
        let v = hex.value.trim();
        if (!v.startsWith("#")) { v = "#" + v; }
        if (/^#[0-9a-f]{3}$/i.test(v)) { v = "#" + [...v.slice(1)].map(ch => ch + ch).join(""); }
        const ok = /^#[0-9a-f]{6}$/i.test(v);
        hex.classList.toggle("bad", !ok);
        if (ok) { state.colours[item.key] = v.toLowerCase(); refresh(hex); }
    });
    hex.addEventListener("blur", () => { hex.classList.remove("bad"); hex.value = state.colours[item.key]; });

    pickers.append(row);
    rows[item.key] = { row, lock, colour, hex, ratio: row.querySelector(".ratio") };
}

// Show the state: pickers, contrast numbers, preview; and remember it in this browser.
// `editing` is a hex field being typed in, left as the user has it.
function refresh(editing) {
    const preview = document.getElementById("preview");
    const { simple, byType } = mode();
    const boxKeys = ["wbox", "bbox"];
    for (const item of ENTRIES) {
        const r = rows[item.key], value = state.colours[item.key];
        r.colour.value = value;
        if (r.hex != editing) { r.hex.value = value; r.hex.classList.remove("bad"); }
        r.lock.checked = !!state.locked[item.key];
        r.row.classList.toggle("locked", !!state.locked[item.key]);
        r.ratio.textContent = "";
        // Simple mode: no boxes to see (the colours are kept, for switching back)
        preview.style.setProperty(item.var, simple && boxKeys.includes(item.key) ? "transparent" : value);
    }
    // Dim the groups the export won't use in the style chosen
    const unused = unusedGroups(simple);
    for (const el of pickers.querySelectorAll("[data-group]")) {
        el.classList.toggle("unused", unused.has(el.dataset.group));
    }
    // Beside each colour: its worst contrast check (with colour-blind safe on, perhaps as one kind sees it)
    const checked = checks(state.colours);
    const shown = {};
    for (const check of checked) {
        const was = shown[check.key];
        if (check.key && (!was || check.value / check.target < was.value / was.target)) { shown[check.key] = check; }
    }
    for (const { key, value, target, vision } of Object.values(shown)) {
        const r = rows[key].ratio;
        r.textContent = value.toFixed(1);
        r.classList.toggle("low", value < target);
        r.title = "Contrast " + value.toFixed(2) + ":1 (aim for at least " + target + ")"
            + (vision ? ", as seen with " + kindName(vision).toLowerCase() : "");
    }
    drawCvdReport(checked);
    try {
        localStorage.setItem(STORE, JSON.stringify({ ...state, name: document.getElementById("themeName").value,
            simple, pageLight: document.getElementById("pageLight").checked, cvd: cvdOn(), cvdView: cvdView() }));
    } catch {}
}

// ---------- Colour-blind safe: the report under the hint, and the preview as each kind sees it ----------
const kindName = id => KINDS.find(k => k.id == id).name;
// "White king", "Moves", ...
function colourName(key) {
    const e = ENTRIES.find(x => x.key == key);
    return / pieces$/.test(e.group) ? e.group.replace(/ pieces$/, "") + " " + e.name.toLowerCase() : e.name;
}

// What is met, or each check that isn't (the contrast ones also show orange beside their colour)
function drawCvdReport(checked) {
    const report = document.getElementById("cvdReport");
    report.hidden = !cvdOn();
    if (!cvdOn()) { return; }
    const problems = [
        ...checked.filter(x => x.vision && x.value < x.target).map(x => kindName(x.vision) + ": "
            + (x.key ? colourName(x.key) : "the two sides") + " contrast " + x.value.toFixed(2) + " (aim for " + x.target + ")"),
        ...apartChecks(state.colours).filter(x => x.value < x.target).map(x => kindName(x.vision) + ": "
            + colourName(x.a) + " and " + colourName(x.b).toLowerCase() + " look alike (" + x.value.toFixed(1)
            + ", aim for " + x.target + ")"),
    ];
    const names = KINDS.map(k => k.name.toLowerCase());
    const head = document.createElement("div");
    head.className = problems.length ? "warn" : "ok";
    head.textContent = problems.length
        ? problems.length + " colour-blind check" + (problems.length == 1 ? "" : "s") + " not met:"
        : "Meets the colour-blind checks for " + names.slice(0, -1).join(", ") + " and " + names.at(-1) + ".";
    const ul = document.createElement("ul");
    const MAX = 12;
    for (const text of [...problems.slice(0, MAX), ...(problems.length > MAX ? ["and " + (problems.length - MAX) + " more"] : [])]) {
        const li = document.createElement("li");
        li.textContent = text;
        ul.append(li);
    }
    report.replaceChildren(head, ...(problems.length ? [ul] : []));
}

// The SVG filters that show the preview as each kind sees it (the same matrices as the checks)
document.body.insertAdjacentHTML("beforeend", '<svg width="0" height="0" style="position: absolute" aria-hidden="true">'
    + KINDS.map(k => '<filter id="cvd-' + k.id + '" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="'
        + ColourVision.svgMatrix(k.id) + '"/></filter>').join("") + '</svg>');

// View as: Normal, or as one kind sees it. Shown while colour-blind safe is on.
const cvdViewGroup = document.getElementById("cvdView");
cvdViewGroup.innerHTML = [{ id: "normal", name: "Normal", note: "the colours as they are" }, ...KINDS].map(k =>
    '<label title="' + k.name + ": " + k.note + '"><input type="radio" name="cvdView" value="' + k.id + '"'
    + (k.id == "normal" ? " checked" : "") + "> " + k.name + "</label>").join("");
function cvdView() {
    return cvdViewGroup.querySelector("input:checked")?.value ?? "normal";
}
// Set the switch and the view, and show the preview that way
function showCvd(on, view) {
    document.getElementById("cvd").checked = on;
    (cvdViewGroup.querySelector('input[value="' + view + '"]') ?? cvdViewGroup.querySelector("input")).checked = true;
    cvdViewGroup.hidden = !on;
    document.querySelector(".preview-grid").style.filter = on && cvdView() != "normal" ? "url(#cvd-" + cvdView() + ")" : "";
}
document.getElementById("cvd").addEventListener("change", () => { showCvd(cvdOn(), cvdView()); refresh(); });
cvdViewGroup.addEventListener("change", () => { showCvd(true, cvdView()); refresh(); });

// ---------- The preview boards ----------
function glyph(side, type, lost) {
    return '<span class="glyph glyph-' + side + ' glyph-' + side + type + (lost ? " glyph-lost" : "") + '"></span>';
}
// A piece as waveHTML (src/client/glyphs.js) writes it. lost: types just ruled out, shown faded.
function piece(side, waves, lost = "") {
    const cls = side == "w" ? "whitepiece" : "blackpiece";
    if (waves.length == 1 && !lost) { return '<div class="' + cls + 'collapsed">' + glyph(side, waves) + '</div>'; }
    return '<div class="' + cls + '">' + TYPES.map(t => waves.includes(t) ? glyph(side, t)
        : lost.includes(t) ? glyph(side, t, true) : "<span></span>").join("") + '</div>';
}
// A board from rows of cells: [side, waves, extra classes, lost types]. The top-left square is light.
function board(cells) {
    return '<div class="board">' + cells.map((row, y) => '<div class="boardrow">' + row.map((cell, x) => {
        const [side, waves, extra, lost] = cell || [];
        const colour = (x + y) % 2 ? "blacksquare" : "whitesquare";
        return '<div class="boardsquare ' + colour + (extra ? " " + extra : "") + '">'
            + (side ? piece(side, waves, lost) : "") + '</div>';
    }).join("") + '</div>').join("") + '</div>';
}

const ALL = "KQRBNP";
// The classes of a move marker (board-view.js): bearing 1-16 clockwise from 16 = up, odd = a knight's hop
const move = (bearing, capture) => "destination destination" + bearing + (capture ? " destinationCapture" : "");
// White to move: White's pieces ringed; the chosen rook's moves marked along its file and rank, up to a capture;
// Black's king in check from a known White queen.
document.getElementById("playBoard").innerHTML = board([
    [["b", "R"], ["b", "KQRBNP"], ["b", "QB", move(16, true)], ["b", "K", "checkKing"], ["b", "KQRBNP"], ["b", "N"]],
    [["b", "P"], ["b", "KP"], [, , move(16)], ["b", "P"], ["b", "BNP"], ["b", "P"]],
    [null, null, [, , move(16)], null, [, , "potAttacker"], null],
    [[, , move(12)], [, , move(12)], ["w", "R", "selectedStart"], [, , move(4)], [, , "hovered"], null],
    [["w", "P", "selectable"], ["w", "KP", "selectable"], [, , move(8)], ["w", "Q", "selectable checkAttacker"], ["w", "BNP", "selectable"], ["w", "P", "selectable"]],
    [["w", "KQRBNP", "selectable"], ["w", "N", "selectable"], ["w", "B", "selectable"], ["w", "K", "selectable"], ["w", "KQRBNP", "selectable"], ["w", "QR", "selectable"]],
]);

// Each type twice, shifted by one, so it shows on both square colours
const shifted = (side, by) => TYPES.map((t, i) => [side, TYPES[(i + by) % 6]]);
document.getElementById("pieceBoard").innerHTML = board([
    shifted("w", 0),
    shifted("w", 1),
    shifted("b", 0),
    shifted("b", 1),
    // (the White KQR has just lost B, N and P to a move not yet submitted: shown faded)
    [["w", ALL], ["w", "KQR", "", "BNP"], ["w", "BN"], ["b", ALL], ["b", "QRP"], ["b", "KN"]],
]);

const STATES = [
    ["Side to move", "selectable", "w", "KQRBNP"],
    ["Hover", "hovered", "w", "KQRBNP"],
    ["Chosen piece", "selectedStart", "w", "Q"],
    ["Chosen destination", "selectedEnd", null, ""],
    ["Move: up", move(16), null, ""],
    ["Move: right", move(4), null, ""],
    ["Move: diagonal", move(2), null, ""],
    ["Move: knight hop", move(1), null, ""],
    ["Capture", move(4, true), "b", "N"],
    ["Knight capture", move(1, true), "b", "KQRBNP"],
    ["King in check", "checkKing", "b", "K"],
    ["Checking piece", "checkAttacker", "w", "R"],
    ["Could be the king", "potKing", "b", "KQRBNP"],
    ["Could be attacking", "potAttacker", "w", "KQRBNP"],
];
document.getElementById("stateExamples").innerHTML = STATES.map(([label, cls, side, waves]) =>
    '<div class="example">' + board([[side ? [side, waves, cls] : [, , cls], side ? [side, waves, cls] : [, , cls]]])
    + '<span title="' + label + '">' + label + '</span></div>').join("");

// ---------- Export: a theme file for themes/ (style.css 1.1 lists what it sets) ----------
function exportCss() {
    const raw = document.getElementById("themeName").value.trim() || "Custom";
    const name = raw.replace(/["\\\n\r]|\*\//g, "");
    const { simple, byType } = mode();
    const page = document.getElementById("pageLight").checked ? "light" : "dark";
    const c = state.colours;
    const piece = (side, t) => byType ? c[side + t] : c[side + "Side"];
    const line = (v, value, note) => "    " + (v + ":").padEnd(30) + value + ";" + (note ? "  /* " + note + " */" : "");
    const css = [
        "/* Qhess board theme \"" + name + "\", made with tools/theme-generator.html.",
        "   The game lists every .css file in this folder (themes/index.json); see style.css 1.1 for what a theme sets.",
        "   .qhess-theme stands for this theme: the game puts the theme's own selector in its place. */",
        ".qhess-theme {",
        line("--theme-name", '"' + name + '"', "its name in the Theme dialog"),
        line("--theme-page", page, "the page around the board: dark or light"),
        "",
        "    /* Squares */",
        ...["light", "dark", "border"].map(k => line(ENTRIES.find(e => e.key == k).var, c[k])),
        "",
        ...(simple ? [
            "    /* Pieces: White in outline, Black filled, no boxes */",
            "    --white-K: var(--outline-K); --white-Q: var(--outline-Q); --white-R: var(--outline-R);",
            "    --white-B: var(--outline-B); --white-N: var(--outline-N); --white-P: var(--outline-P);",
            line("--glyph-w-bg", "transparent"),
            line("--glyph-b-bg", "transparent"),
            line("--glyph-radius", "0"),
            line("--glyph-padding", "0"),
            line("--glyph-margin", "0"),
            line("--glyph-shadow", "none"),
            line("--glyph-line-height", "initial"),
            line("--uncollapsed-size", "1em"),
            line("--collapsed-size", "2.7em"),
        ] : [
            "    /* Pieces: every symbol filled, on a box per side */",
            "    --white-K: var(--filled-K); --white-Q: var(--filled-Q); --white-R: var(--filled-R);",
            "    --white-B: var(--filled-B); --white-N: var(--filled-N); --white-P: var(--filled-P);",
            line("--glyph-w-bg", c.wbox, "White's box"),
            line("--glyph-b-bg", c.bbox, "Black's box"),
            line("--glyph-radius", "0.25em"),
            line("--glyph-padding", "0"),
            line("--glyph-margin", "2px"),
            line("--glyph-shadow", "1px 1px 3px #0008"),
            line("--glyph-line-height", "1"),
            line("--uncollapsed-size", "0.9em"),
            line("--collapsed-size", "2.2em"),
        ]),
        "",
        byType ? "    /* A colour per type */" : "    /* One colour per side */",
        ...["w", "b"].flatMap(side => TYPES.map(t => line("--piece-" + side + t, piece(side, t)))),
        "",
        "    /* Highlights */",
        line("--piece-selectedStart-col", c.select, "side to move, hover, chosen piece"),
        line("--piece-dest-col", c.dest, "moves"),
        line("--piece-capture-col", c.capture, "moves that take a piece"),
        line("--piece-checkKing-col", c.checkKing, "king in check, could be the king"),
        line("--piece-checkAttacker-col", c.checkAttacker, "checking piece, could be attacking"),
        "}",
        "",
    ].join("\n");

    const url = URL.createObjectURL(new Blob([css], { type: "text/css" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = (name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "custom") + ".css";
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- Import: the colours (and name) from a theme's CSS, such as an earlier Export ----------
// Any colour the browser understands (#abc, #aabbcc, rgb(), names), as #rrggbb; null if it isn't one, or is
// see-through (a theme with no boxes has transparent ones)
function toHex(value) {
    const probe = document.createElement("i");
    probe.style.color = value;
    if (!probe.style.color) { return null; }
    document.body.append(probe);
    const parts = getComputedStyle(probe).color.match(/[\d.]+/g).map(Number);
    probe.remove();
    return parts.length > 3 && parts[3] == 0 ? null : rgbToHex(parts.slice(0, 3));
}

// Set every colour the CSS gives (the first value for each variable), keep the rest and the locks, and say how
// many were found. Reads theme files (themes/) and the older exports (themes/custom.css) alike.
function importCss(css, fileName) {
    const values = {};
    for (const [, name, value] of css.replace(/\/\*[\s\S]*?\*\//g, "").matchAll(/(--[\w-]+)\s*:\s*([^;}]+)/g)) {
        if (!(name in values)) { values[name] = value.trim(); }
    }
    // One colour per side (all six of a side's pieces the same): that is the side's colour, and the switch is off
    const sideColour = side => {
        const hexes = TYPES.map(t => values["--piece-" + side + t] && toHex(values["--piece-" + side + t]));
        return hexes[0] && hexes.every(h => h == hexes[0]) ? hexes[0] : null;
    };
    const oneColour = sideColour("w") && sideColour("b");
    if (oneColour) {
        values["--piece-white-side"] = sideColour("w");
        values["--piece-black-side"] = sideColour("b");
    }
    // Simple: one colour per side, White drawn in outline, or no boxes
    const simple = oneColour || /outline/.test(values["--white-K"] ?? "") || values["--glyph-w-bg"] == "transparent";
    // The colours that style uses; the others are set if the file has them, but not missed if it hasn't
    const needed = ENTRIES.filter(item => !unusedGroups(simple).has(item.group));
    const missing = [];
    let found = 0;
    for (const item of ENTRIES) {
        // A one-colour theme's pieces are its side colours, not colours per type: keep those as they are
        const hex = oneColour && /^[wb][KQRBNP]$/.test(item.key) ? null
            : values[item.var] ? toHex(values[item.var]) : null;
        if (hex) { state.colours[item.key] = hex; }
        if (needed.includes(item)) {
            if (hex) { found++; } else { missing.push(item.group + ": " + item.name); }
        }
    }
    const name = (values["--theme-name"] ?? values["--custom-theme-name"])?.replace(/^["']|["']$/g, "");
    if (found && name) { document.getElementById("themeName").value = name; }
    if (found) { setToggles(simple, values["--theme-page"] == "light"); }

    const status = document.getElementById("importStatus");
    status.classList.toggle("warn", found < needed.length);
    status.textContent = !found ? "No theme colours in " + fileName
        : "Imported " + found + " of " + needed.length + " colours (" + (simple ? "Simple" : "Distinct") + ") from "
            + fileName + (missing.length ? "; " + missing.length + " kept as they were" : "");
    status.title = found && missing.length ? "Kept as they were:\n" + missing.join("\n") : "";
    refresh();
}

async function importFile(file) {
    if (file) { importCss(await file.text(), file.name); }
}

const fileInput = document.getElementById("importFile");
document.getElementById("import").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { importFile(fileInput.files[0]); fileInput.value = ""; });

// Or drop the file anywhere on the page
window.addEventListener("dragover", e => {
    if (e.dataTransfer.types.includes("Files")) { e.preventDefault(); document.body.classList.add("dropping"); }
});
window.addEventListener("dragleave", e => { if (!e.relatedTarget) { document.body.classList.remove("dropping"); } });
window.addEventListener("drop", e => {
    if (!e.dataTransfer.files.length) { return; }
    e.preventDefault();
    document.body.classList.remove("dropping");
    importFile(e.dataTransfer.files[0]);
});

// ---------- Buttons and start-up ----------
function defaults() {
    for (const item of ENTRIES) { state.colours[item.key] = item.def; }
}

document.getElementById("generate").addEventListener("click", generate);
document.getElementById("export").addEventListener("click", exportCss);
document.getElementById("reset").addEventListener("click", () => { defaults(); setToggles(false, false); refresh(); });
document.getElementById("themeName").addEventListener("input", () => refresh());
// The style (Simple or Distinct) and Light page, part of the theme (see exportCss): set them and show them in the
// preview
function setToggles(simple, pageLight) {
    document.getElementById(simple ? "simple" : "distinct").checked = true;
    document.getElementById("pageLight").checked = pageLight;
    document.getElementById("preview").classList.toggle("side-colours", simple);
    document.getElementById("preview").classList.toggle("page-light", pageLight);
    document.getElementById("preview").classList.toggle("simple", simple);
}
const toggled = () => {
    setToggles(document.getElementById("simple").checked, document.getElementById("pageLight").checked);
    refresh();
};
for (const id of ["simple", "distinct", "pageLight"]) { document.getElementById(id).addEventListener("change", toggled); }

defaults();
try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if (saved) {
        for (const item of ENTRIES) {
            if (/^#[0-9a-f]{6}$/i.test(saved.colours?.[item.key] ?? "")) { state.colours[item.key] = saved.colours[item.key]; }
            state.locked[item.key] = saved.locked?.[item.key] === true;
        }
        if (typeof saved.name == "string") { document.getElementById("themeName").value = saved.name; }
        setToggles(saved.simple === true, saved.pageLight === true);
        showCvd(saved.cvd === true, saved.cvdView);
    }
} catch {}
refresh();
</script>
